<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mission Tracker</h1>
        
        <div class="controls">
            <input type="text" id="newMissionInput" placeholder="New mission (e.g. Workout)...">
            <button onclick="addMission()">Add Mission</button>
            <select id="missionSelect" onchange="renderCalendar()"></select>
        </div>

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#9664; Prev</button>
            <h2 id="monthYearDisplay"></h2>
            <button onclick="changeMonth(1)">Next &#9654;</button>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
            <div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
